<!doctype html><html lang="sv"><head><meta charset="utf-8">

<title>HQ — The Rack V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06070a;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
body{background:radial-gradient(circle at 10% 0%,#13202a 0,transparent 25%),radial-gradient(circle at 95% 20%,#1a1429 0,transparent 28%),#06070a}
main{max-width:680px;margin:auto;padding:28px 16px 60px}.ey{font-size:10px;letter-spacing:.28em;color:#9299a7;font-weight:800}
h1{font-size:31px;margin:8px 0 2px;letter-spacing:-.03em}.sub{color:#969da9}.status{margin:22px 0;padding:16px;border-radius:20px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:inset 0 1px rgba(255,255,255,.12),0 14px 35px #0008}
.status>div{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#b9bec8}.bar{height:6px;background:#0d1015;border-radius:9px;margin-top:12px;overflow:hidden}#fill{display:block;height:100%;width:0;background:linear-gradient(90deg,#9b7cff,#53d8ff,#55e39a);transition:width .4s}
.rack{display:grid;gap:14px}.rackunit{--c:#ff6477;-webkit-appearance:none;appearance:none;position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:76px;padding:15px;border-radius:18px;border:1px solid rgba(255,255,255,.16);border-top-color:rgba(255,255,255,.28);background:linear-gradient(135deg,rgba(255,255,255,.115),rgba(255,255,255,.035) 55%,rgba(255,255,255,.07));color:#f7f8fb;text-align:left;display:flex;align-items:center;gap:12px;-webkit-backdrop-filter:blur(24px) saturate(155%);backdrop-filter:blur(24px) saturate(155%);box-shadow:inset 0 1px rgba(255,255,255,.13),0 11px 28px #0008,0 0 22px color-mix(in srgb,var(--c) 20%,transparent);transition:transform .25s cubic-bezier(.16,1,.3,1),opacity .2s}
.rackunit:after{content:"";position:absolute;z-index:-1;left:8%;right:8%;bottom:-7px;height:17px;border-radius:50%;background:var(--c);filter:blur(16px);opacity:.58}.rackunit.mix{--c:#ffb14e}.rackunit.ready{--c:#55e39a}
.rackunit:active{transform:scale(.975)}.glass-shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.20),rgba(255,255,255,.03) 20%,transparent 48%,rgba(255,255,255,.05))}
.led{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c),0 0 18px var(--c)}.meta{min-width:0;flex:1}small{display:block;color:#7f8794;font:9px ui-monospace,monospace;letter-spacing:.16em}strong{display:block;margin-top:3px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font:9px ui-monospace,monospace;color:#aeb5c0;background:#090b0f99;border:1px solid #333842;padding:6px 7px;border-radius:6px;white-space:nowrap}.chev{color:#858c98;font-size:20px}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(2,3,5,.35);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}.overlay.open{display:flex}
.detail{--c:#ff6477;position:relative;overflow:hidden;width:min(100%,680px);min-height:55vh;padding:18px 18px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;border:1px solid rgba(255,255,255,.20);border-bottom:0;background:linear-gradient(145deg,rgba(34,37,45,.94),rgba(12,14,19,.94));-webkit-backdrop-filter:blur(30px) saturate(165%);backdrop-filter:blur(30px) saturate(165%);box-shadow:inset 0 1px rgba(255,255,255,.18),0 -10px 60px #000b,0 0 50px color-mix(in srgb,var(--c) 25%,transparent);animation:grow .42s cubic-bezier(.16,1,.3,1)}
@keyframes grow{from{transform:translateY(35%) scale(.92);opacity:0;border-radius:40px}to{transform:none;opacity:1;border-radius:28px 28px 0 0}}
.detail:after{content:"";position:absolute;left:8%;right:8%;top:-8px;height:20px;background:var(--c);filter:blur(18px);opacity:.6}.handle{width:42px;height:5px;border-radius:9px;background:#ffffff35;margin:0 auto 22px}.detailhead{display:flex;align-items:center;gap:12px}.bigled{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c),0 0 24px var(--c)}.detail h2{font-size:28px;margin:4px 0 0}.detail .channel{font:10px ui-monospace,monospace;color:#858d99;letter-spacing:.18em}
.steps{display:grid;gap:12px;margin-top:28px}.step{-webkit-appearance:none;appearance:none;border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.035));color:#d9dde4;border-radius:18px;padding:18px;text-align:left;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;box-shadow:inset 0 1px rgba(255,255,255,.10)}.step span{font:10px ui-monospace,monospace;color:#8e96a2}.step.done{border-color:#55e39a66;background:#55e39a18;color:#dffff0;box-shadow:inset 0 0 24px #55e39a0c,0 0 22px #55e39a14}
.close{margin-top:20px;width:100%;border:0;background:transparent;color:#89919e;padding:14px;font-weight:700}
.detail.disco{animation:party 1.6s linear}@keyframes party{0%{--c:#111}15%{--c:#ff5ccf}30%{--c:#53d8ff}45%{--c:#ffc857}60%{--c:#9b7cff}75%{--c:#53d8ff}100%{--c:#55e39a}}
.note{text-align:center;color:#656d79;font-size:11px;margin-top:22px}
</style></head><body><section id="rackHome" style="max-width:680px;margin:auto;padding:28px 16px 60px">

</button>
<div style="text-align:center;color:#656d79;font-size:11px;margin-top:22px">Fler projekt kan läggas till senare.</div>

<main id="projectView" style="display:none"><button id="backRack" type="button" style="-webkit-appearance:none;appearance:none;border:0;background:transparent;color:#9da4af;padding:0 0 14px;font-weight:800;font-size:12px">‹ THE RACK</button><div class="ey">LILLUMINATI RECORDS / PROJECT</div><h1>Blodstänk &amp; Skålar</h1><div class="sub">Lilleman &amp; Juan Havana · 20 låtar</div>
<section class="status"><div><span>ALBUM STATUS</span><span id="count">0 / 20 READY</span></div><div class="bar"><i id="fill"></i></div></section>

<div class="overlay" id="overlay"><section class="detail" id="detail"><div class="handle"></div><div class="detailhead"><span class="bigled"></span><div><div class="channel" id="dchannel"></div><h2 id="dname"></h2></div></div>
<div class="steps"><button class="step" id="mix" type="button">MIX <span>NOT READY</span></button><button class="step" id="master" type="button">MASTER <span>NOT READY</span></button></div><button class="close" id="close" type="button">Stäng</button></section></div>
<script>
(function(){
var names=["Nah Nah Nah", "BS&S", "Högre", "95", "Rikedom", "Rap", "Click Clack", "Jag vill upp", "Ryssen kommer", "Ålderskris", "Ha ha ha", "På din dörr", "Maskotar", "Ondskan", "Skiner", "Hicka/Dubai", "Svart bälte", "Panenka", "Champion", "Värdefullt"], key="lilluminati-v12", data={}, current=null;
try{data=JSON.parse(localStorage.getItem(key)||"{}");}catch(e){}
function s(i){return data[i]||{mix:false,master:false}} function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
var cards=document.querySelectorAll(".rackunit"), overlay=document.getElementById("overlay"), detail=document.getElementById("detail");
function paint(){
 var n=0;cards.forEach(function(c,i){var x=s(i);c.classList.toggle("mix",x.mix&&!x.master);c.classList.toggle("ready",x.mix&&x.master);c.querySelector(".state").textContent=x.mix&&x.master?"READY":x.mix?"MASTER NEXT":"MIX NEXT";if(x.mix&&x.master)n++;});
 document.getElementById("count").textContent=n+" / "+names.length+" READY";document.getElementById("fill").style.width=(n/names.length*100)+"%";
 if(current!==null)paintDetail();
}
function paintDetail(){var x=s(current);detail.style.setProperty("--c",x.mix&&x.master?"#55e39a":x.mix?"#ffb14e":"#ff6477");document.getElementById("dchannel").textContent="CHANNEL "+String(current+1).padStart(2,"0");document.getElementById("dname").textContent=names[current];
 [["mix","mix"],["master","master"]].forEach(function(a){var b=document.getElementById(a[0]),on=x[a[1]];b.classList.toggle("done",on);b.querySelector("span").textContent=on?"✓ READY":"NOT READY";});
}
cards.forEach(function(c,i){c.onclick=function(){current=i;paintDetail();overlay.classList.add("open");}});
document.getElementById("close").onclick=function(){overlay.classList.remove("open");current=null};
overlay.onclick=function(e){if(e.target===overlay){overlay.classList.remove("open");current=null}};
document.getElementById("mix").onclick=function(){var x=s(current);x.mix=!x.mix;if(!x.mix)x.master=false;data[current]=x;save();paint()};
document.getElementById("master").onclick=function(){var x=s(current),was=x.mix&&x.master;if(!x.master){x.mix=true;x.master=true}else x.master=false;data[current]=x;save();paint();if(!was&&x.mix&&x.master){detail.classList.remove("disco");void detail.offsetWidth;detail.classList.add("disco");setTimeout(function(){detail.classList.remove("disco");paintDetail()},1650)}};
paint();
var rackHome=document.getElementById("rackHome"), projectView=document.getElementById("projectView");
function syncHome(){
 var n=0; names.forEach(function(_,i){var x=s(i);if(x.mix&&x.master)n++;});
 document.getElementById("homeProgress").textContent=n+" / "+names.length+" READY";
 document.getElementById("homeFill").style.width=(n/names.length*100)+"%";
}
document.getElementById("openProject").onclick=function(){
 rackHome.style.display="none"; projectView.style.display="block"; window.scrollTo(0,0);
};
document.getElementById("backRack").onclick=function(){
 projectView.style.display="none"; rackHome.style.display="block"; syncHome(); window.scrollTo(0,0);
};
var originalPaint=paint;
paint=function(){originalPaint();syncHome();};
syncHome();
})();
</script></body></html>
