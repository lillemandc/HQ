<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HQ · HOME</title>
<link rel="stylesheet" href="../shared/hq.css">
<style>
:root{--green:#28e4a4;--muted:#8794aa}
*{box-sizing:border-box}
body{
 margin:0;color:#f7f9fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
 background:
 radial-gradient(circle at 14% 4%,rgba(26,105,83,.14),transparent 29%),
 radial-gradient(circle at 92% 30%,rgba(18,65,58,.09),transparent 28%),
 #030609;
}
.shell{max-width:760px;margin:auto;padding:22px 22px 110px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.back,.more{color:#dce8f5;text-decoration:none;background:rgba(255,255,255,.035);border:1px solid rgba(190,215,240,.20);border-radius:999px;min-height:42px;padding:0 15px;display:grid;place-items:center;font-weight:800}
.ey{font:800 10px ui-monospace,monospace;letter-spacing:.28em;color:#62e7bb}
h1{font-size:clamp(42px,10vw,62px);letter-spacing:-.045em;margin:7px 0 4px}
.sub{color:#8491a7;margin:0 0 25px}
.glass{border:1px solid rgba(174,200,230,.25);border-top-color:rgba(220,234,249,.38);background:linear-gradient(145deg,rgba(20,29,40,.78),rgba(8,13,20,.74));backdrop-filter:blur(25px) saturate(145%);-webkit-backdrop-filter:blur(25px) saturate(145%);box-shadow:inset 0 1px rgba(255,255,255,.06),0 12px 35px rgba(0,0,0,.24)}
.hero{padding:24px;border-radius:30px;margin-bottom:25px}
.label,.head{font:800 9px ui-monospace,monospace;letter-spacing:.18em;color:#9eb0c9}
.hero h2{font-size:28px;letter-spacing:-.035em;margin:8px 0 7px}
.hero p{color:#91a2ba;margin:0 0 19px;line-height:1.4}
#capture{width:100%;min-height:70px;border-radius:999px;color:#f8fbff;font-weight:850;letter-spacing:.10em;font-size:15px;background:radial-gradient(ellipse at 50% 5%,rgba(255,255,255,.10),transparent 47%),linear-gradient(180deg,rgba(14,24,34,.82),rgba(5,10,16,.72));border:1px solid rgba(190,222,250,.50);border-top-color:rgba(239,249,255,.90);border-left-color:rgba(40,228,164,.72);border-bottom-color:rgba(40,228,164,.55);box-shadow:inset 9px 0 18px -17px rgba(40,228,164,.95),inset 0 8px 16px -15px rgba(255,255,255,.95),0 9px 26px rgba(0,0,0,.44),0 0 24px rgba(40,228,164,.10)}
.head{display:flex;justify-content:space-between;align-items:center;margin:26px 5px 10px}.head span{color:#68778e}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.quick button{min-height:96px;border-radius:25px;text-align:left;padding:17px;border:1px solid rgba(174,200,230,.22);border-top-color:rgba(220,234,249,.34);background:linear-gradient(145deg,rgba(20,29,40,.78),rgba(8,13,20,.74));color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.23)}
.quick i{display:block;font-style:normal;font-size:22px;color:#55e8b8;margin-bottom:9px}.quick b{display:block;font-size:14px}.quick small{display:block;color:#8291a7;margin-top:4px}
.item{border-radius:24px;padding:17px;margin-bottom:10px;display:grid;grid-template-columns:1fr 42px;gap:12px;align-items:center}
.item small{display:block;color:#65bca0;font:800 8px ui-monospace,monospace;letter-spacing:.12em;margin-bottom:5px}
.item b{font-size:15px;line-height:1.3}
.done{width:38px;height:38px;border-radius:50%;border:1px solid rgba(40,228,164,.30);background:rgba(40,228,164,.07);color:#65efbf;font-size:17px}
.empty{border-radius:24px;padding:22px;color:#718096}
.sheetWrap{position:fixed;inset:0;display:none;z-index:50;background:rgba(0,0,0,.52);backdrop-filter:blur(10px);align-items:flex-end}.sheetWrap.open{display:flex}
.sheet{width:100%;max-width:760px;margin:auto;padding:24px 22px calc(25px + env(safe-area-inset-bottom));border-radius:30px 30px 0 0;background:linear-gradient(150deg,rgba(24,32,44,.98),rgba(8,13,20,.99));border:1px solid rgba(215,232,249,.25)}
.sheetTop{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:15px 0}.close{border:0;background:none;color:#9fcdbd;font-weight:800}
textarea{width:100%;min-height:110px;resize:none;border-radius:20px;border:1px solid rgba(190,215,240,.20);background:#080d14;color:white;padding:16px;font:600 16px system-ui;outline:none}
.chips{display:flex;gap:8px;margin:13px 0 18px;overflow:auto}.chips button{white-space:nowrap;border-radius:999px;padding:9px 12px;border:1px solid rgba(150,180,215,.20);background:#0c131d;color:#8492a6;font:800 8px ui-monospace,monospace}.chips button.active{background:#28e4a4;color:#03110d;border-color:#69f0c3;box-shadow:0 0 17px rgba(40,228,164,.20)}
.save{width:100%;min-height:54px;border:0;border-radius:18px;background:#f3f6fb;color:#07101a;font-weight:900}
</style>
</head>
<body>
<main class="shell">
 <div class="top"><a class="back" href="../index.html">‹ HQ</a><button class="more">•••</button></div>
 <div class="ey">HQ / PRIVATE</div><h1>HOME</h1><p class="sub">Familjen, hemmet och livet utanför jobbet.</p>

 <section class="glass hero">
  <div class="label">HEMMA</div><h2>Vad behöver du komma ihåg?</h2>
  <p>Samla familjesaker, inköp och ärenden här. CTRL ROOM kan senare lyfta det som är viktigt just idag.</p>
  <button id="capture">＋ LÄGG TILL</button>
 </section>

 <div class="head"><b>SNABBT</b><span>HOME</span></div>
 <div class="quick">
  <button data-cat="FAMILJ"><i>♡</i><b>FAMILJ</b><small>Barn & privat</small></button>
  <button data-cat="HEMMET"><i>⌂</i><b>HEMMET</b><small>Fixa & ärenden</small></button>
  <button data-cat="INKÖP"><i>＋</i><b>INKÖP</b><small>Att köpa</small></button>
  <button data-cat="KOMMANDE"><i>○</i><b>KOMMANDE</b><small>Senare</small></button>
 </div>

 <div class="head"><b>AKTUELLT</b><span id="count">0</span></div>
 <div id="items"></div>
</main>

<div class="sheetWrap" id="wrap">
 <div class="sheet glass">
  <div class="sheetTop"><div class="label">HOME / CAPTURE</div><button class="close" id="close">STÄNG</button></div>
  <h2>Lägg till i HOME</h2>
  <textarea id="input" placeholder="T.ex. Köp matsäck till utflykten…"></textarea>
  <div class="chips">
   <button class="active" data-cat="FAMILJ">FAMILJ</button>
   <button data-cat="HEMMET">HEMMET</button>
   <button data-cat="INKÖP">INKÖP</button>
   <button data-cat="KOMMANDE">KOMMANDE</button>
  </div>
  <button class="save" id="save">SPARA I HOME</button>
 </div>
</div>
<script>
const $=s=>document.querySelector(s),KEY="hq_home_v1";let cat="FAMILJ";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}};
const store=a=>localStorage.setItem(KEY,JSON.stringify(a));
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\"":"&quot;","'":"&#39;"}[c]));
function render(){const a=load();$("#count").textContent=a.length;$("#items").innerHTML=a.length?a.map((x,i)=>`<div class="glass item"><div><small>${x.cat}</small><b>${esc(x.text)}</b></div><button class="done" data-i="${i}">✓</button></div>`).join(""):`<div class="glass empty">Inget som kräver din uppmärksamhet här.</div>`;document.querySelectorAll(".done").forEach(b=>b.onclick=()=>{const a=load();a.splice(+b.dataset.i,1);store(a);render()})}
function open(c){cat=c||"FAMILJ";document.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("active",x.dataset.cat===cat));$("#wrap").classList.add("open");setTimeout(()=>$("#input").focus(),120)}
$("#capture").onclick=()=>open("FAMILJ");document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>open(b.dataset.cat));$("#close").onclick=()=>$("#wrap").classList.remove("open");$("#wrap").onclick=e=>{if(e.target===$("#wrap"))$("#wrap").classList.remove("open")};document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("active",x===b))});
$("#save").onclick=()=>{const text=$("#input").value.trim();if(!text)return;const a=load();a.unshift({text,cat,created:new Date().toISOString()});store(a);$("#input").value="";$("#wrap").classList.remove("open");render()};
render();
</script>
</body></html>
