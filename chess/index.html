<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>HQ · CHESS CENTER</title>
<style>
:root{--bg:#02060b;--panel:#0b1420cc;--line:#8ea6c52d;--txt:#f6f8fb;--muted:#8795a8;--cyan:#42c8ff;--blue:#3688ff;--green:#35f59a;--pink:#ff3b91}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}
body{background:radial-gradient(900px 650px at 15% 0%,#12395d88,transparent 58%),radial-gradient(600px 500px at 100% 75%,#51205b45,transparent 65%),#02060b;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{width:min(100%,760px);margin:auto;min-height:100vh;padding:26px 18px 34px}
.top{display:flex;align-items:center;justify-content:space-between}.hq{font-size:13px;font-weight:900;letter-spacing:.26em;color:#91a8c4}.back{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:white;text-decoration:none;font-size:25px}
.glass{background:linear-gradient(145deg,#172434b8,#07101ac7);border:1px solid #9db4d03b;box-shadow:inset 0 1px 0 #ffffff26,0 18px 50px #0008;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
h1{font-size:42px;line-height:.95;margin:26px 0 7px;letter-spacing:-.045em}.sub{color:var(--muted);font-weight:700;margin-bottom:22px}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:22px;margin-bottom:16px}.turn{font-size:12px;font-weight:900;letter-spacing:.16em}.mode{font-size:12px;color:#9fb0c4}
.board-shell{padding:10px;border-radius:28px;position:relative;background:linear-gradient(145deg,#15283a,#060b12);border:1px solid #73bfff66;box-shadow:0 0 35px #248dff26,inset 0 1px 0 #ffffff26}
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;border-radius:20px;border:1px solid #9ac6ff45;background:#07111c}
.sq{position:relative;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sq.light{background:linear-gradient(145deg,#263b51,#1b2d40)}.sq.dark{background:linear-gradient(145deg,#07121e,#0b1a29)}
.sq::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 18px #ffffff05;pointer-events:none}
.sq.sel{outline:2px solid var(--cyan);outline-offset:-2px;box-shadow:inset 0 0 24px #42c8ff55}
.sq.move:before{content:"";width:20%;aspect-ratio:1;border-radius:50%;background:#35f59a;box-shadow:0 0 16px #35f59acc;position:absolute}
.piece{position:relative;z-index:2;font-family:"Arial Unicode MS","Noto Sans Symbols 2",serif;font-size:clamp(29px,9.2vw,62px);line-height:1;transform:translateY(-1px)}
.white{color:#f4f8ff;text-shadow:0 0 2px #fff,0 0 10px #9ed7ff,0 0 22px #5aaeff}.black{color:#03070c;-webkit-text-stroke:1px #9dbfe5;text-shadow:0 0 7px #65baff88,0 0 16px #1b6fff55}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.btn{border:0;color:white;border-radius:22px;padding:17px 14px;font-weight:900;letter-spacing:.08em;font-size:12px}.btn.primary{background:linear-gradient(145deg,#18324a,#08121e);border:1px solid #55c8ff88;box-shadow:0 0 20px #35baff26,inset 0 1px #ffffff30}.btn.secondary{background:#0d1722;border:1px solid #ffffff22}
.info{margin-top:16px;padding:18px;border-radius:24px}.info small{display:block;color:#7f91a7;font-weight:900;letter-spacing:.17em;margin-bottom:7px}.info b{font-size:18px}
.footer{margin-top:22px;text-align:center;color:#607084;font:800 10px ui-monospace,monospace;letter-spacing:.16em}
@media(max-width:420px){.app{padding-left:14px;padding-right:14px}h1{font-size:38px}.board-shell{padding:8px;border-radius:24px}.board{border-radius:17px}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="hq">HQ / CHESS CENTER</div><a class="back glass" href="../index.html" aria-label="Till CTRL ROOM">‹</a></div>
  <h1>CHESS<br>CENTER</h1>
  <div class="sub">2D schack i HQ-systemet.</div>

  <div class="status glass"><div class="turn" id="turn">VIT DRAR</div><div class="mode">2 SPELARE · SAMMA ENHET</div></div>
  <div class="board-shell"><div class="board" id="board" aria-label="Schackbräde"></div></div>

  <div class="controls">
    <button class="btn primary" id="newGame">NYTT PARTI</button>
    <button class="btn secondary" id="undo">ÅNGRA</button>
  </div>
  <div class="info glass"><small>HQ STATUS</small><b id="message">Partiet är redo.</b></div>
  <div class="footer">HQ · LIQUID GLASS CHESS</div>
</main>

<script>
const symbols={w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}};
let board,turn="w",selected=null,history=[];
function start(){
 board=[
  ["br","bn","bb","bq","bk","bb","bn","br"],
  ["bp","bp","bp","bp","bp","bp","bp","bp"],
  [null,null,null,null,null,null,null,null],
  [null,null,null,null,null,null,null,null],
  [null,null,null,null,null,null,null,null],
  [null,null,null,null,null,null,null,null],
  ["wp","wp","wp","wp","wp","wp","wp","wp"],
  ["wr","wn","wb","wq","wk","wb","wn","wr"]
 ]; turn="w";selected=null;history=[];render();msg("Partiet är redo.");
}
function clone(b){return b.map(r=>r.slice())}
function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function moves(r,c){
 const pc=board[r][c]; if(!pc)return[]; const col=pc[0],t=pc[1],out=[];
 const add=(rr,cc)=>{if(!inside(rr,cc))return false;if(!board[rr][cc]){out.push([rr,cc]);return true}if(board[rr][cc][0]!==col)out.push([rr,cc]);return false}
 if(t==="p"){let d=col==="w"?-1:1,s=col==="w"?6:1;if(inside(r+d,c)&&!board[r+d][c]){out.push([r+d,c]);if(r===s&&!board[r+2*d][c])out.push([r+2*d,c])}for(const dc of[-1,1])if(inside(r+d,c+dc)&&board[r+d][c+dc]&&board[r+d][c+dc][0]!==col)out.push([r+d,c+dc])}
 if(t==="n")for(const [dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(r+dr,c+dc);
 if(t==="k")for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);
 const rays=[];if(t==="r"||t==="q")rays.push([1,0],[-1,0],[0,1],[0,-1]);if(t==="b"||t==="q")rays.push([1,1],[1,-1],[-1,1],[-1,-1]);
 for(const[dr,dc]of rays){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){if(!add(rr,cc))break;rr+=dr;cc+=dc}}
 return out;
}
function legalForSelected(){return selected?moves(selected[0],selected[1]):[]}
function tap(r,c){
 const pc=board[r][c];
 if(selected){
  const ok=legalForSelected().some(([rr,cc])=>rr===r&&cc===c);
  if(ok){history.push({b:clone(board),turn});const [sr,sc]=selected;board[r][c]=board[sr][sc];board[sr][sc]=null;
   if(board[r][c][1]==="p"&&(r===0||r===7))board[r][c]=board[r][c][0]+"q";
   turn=turn==="w"?"b":"w";selected=null;render();msg((turn==="w"?"Vit":"Svart")+" står på tur.");return}
 }
 if(pc&&pc[0]===turn){selected=[r,c]}else selected=null;render();
}
function render(){
 const el=document.getElementById("board");el.innerHTML="";const lm=legalForSelected();
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){const s=document.createElement("div");s.className="sq "+((r+c)%2?"dark":"light");
  if(selected&&selected[0]===r&&selected[1]===c)s.classList.add("sel");
  if(lm.some(([rr,cc])=>rr===r&&cc===c))s.classList.add("move");
  const pc=board[r][c];if(pc){const p=document.createElement("span");p.className="piece "+(pc[0]==="w"?"white":"black");p.textContent=symbols[pc[0]][pc[1]];s.appendChild(p)}
  s.onclick=()=>tap(r,c);el.appendChild(s)}
 document.getElementById("turn").textContent=turn==="w"?"VIT DRAR":"SVART DRAR";
}
function msg(t){document.getElementById("message").textContent=t}
document.getElementById("newGame").onclick=()=>{if(confirm("Starta ett nytt parti?"))start()};
document.getElementById("undo").onclick=()=>{const h=history.pop();if(!h){msg("Inget drag att ångra.");return}board=h.b;turn=h.turn;selected=null;render();msg("Senaste draget ångrades.")};
start();
</script>
</body></html>
