<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b13"><title>HQ · Schack</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050b13'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-size='48' fill='%2381dfff'%3E♔%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="chess.css?v=glass2"></head>
<body><main class="chess-shell"><header><a href="../index.html" class="back" aria-label="Tillbaka till CTRL ROOM">‹ HQ</a><h1>SCHACK</h1><span class="glass-label">GLASS EDITION</span></header>
<section class="player"><span class="avatar" aria-hidden="true">♚</span><div><strong id="opponent">Dator</strong><small id="opponentSub">Blått rökglas</small></div><label class="level">Nivå<select id="difficulty" aria-label="Datorns svårighetsgrad"><option value="1">1 · Lätt</option><option value="2" selected>2 · Medel</option><option value="3">3 · Svår</option></select></label></section>
<section class="board-frame" aria-label="Schackbräde"><div id="board"><div id="loading">Laddar glaspjäser…</div></div><div id="files" aria-hidden="true">a　 b　 c　 d　 e　 f　 g　 h</div><div id="accessibleBoard" class="sr-only" aria-label="Schackbräde för tangentbord"></div></section>
