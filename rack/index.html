<title>HQ — The Rack</title>
<style>
:root{--red:#ff6477;--amber:#ffb14e;--green:#55e39a;--violet:#9b7cff;--cyan:#53d8ff;--pink:#ff5ccf;--gold:#ffc857}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#06070a;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{background:radial-gradient(circle at 8% 0%,#13202a 0,transparent 26%),radial-gradient(circle at 96% 20%,#1b142a 0,transparent 30%),#06070a}
button{font:inherit} .view{max-width:680px;margin:auto;padding:28px 16px 60px}
.ey{font-size:10px;letter-spacing:.27em;color:#9299a7;font-weight:800} h1{font-size:31px;margin:8px 0 2px;letter-spacing:-.035em} .sub{color:#969da9;font-size:13px}
.glass{border:1px solid rgba(255,255,255,.16);border-top-color:rgba(255,255,255,.29);background:linear-gradient(135deg,rgba(255,255,255,.115),rgba(255,255,255,.035) 55%,rgba(255,255,255,.07));-webkit-backdrop-filter:blur(24px) saturate(155%);backdrop-filter:blur(24px) saturate(155%);box-shadow:inset 0 1px rgba(255,255,255,.13),0 12px 30px #0008}

.project:active{transform:translateZ(0) scale(.985)} .project-title{font-size:25px;font-weight:800;margin-top:8px;letter-spacing:-.025em} .project-sub{color:#9ca3af;font-size:13px;margin-top:4px}
.project-foot{display:flex;align-items:center;gap:10px;margin-top:22px} .p-led{width:9px;height:9px;border-radius:50%;background:var(--violet);box-shadow:0 0 18px var(--violet)} .mono{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#b5bbc5} .arrow{margin-left:auto;color:#89919e;font-size:22px}
.bar{height:5px;background:#0d1015;border-radius:9px;margin-top:12px;overflow:hidden} .fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--green));transition:width .35s ease}
#projectView{display:none;opacity:0;transform:translate3d(0,12px,0)} #projectView.show{display:block;animation:viewIn .38s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes viewIn{to{opacity:1;transform:translate3d(0,0,0)}} .back{border:0;background:transparent;color:#9da4af;padding:0 0 14px;font-weight:800;font-size:12px}
.album-status{margin:20px 0 18px;padding:15px;border-radius:20px} .status-line{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#b9bec8}
.rack{display:grid;gap:13px} .track{--c:var(--red);-webkit-appearance:none;appearance:none;width:100%;min-height:76px;padding:15px;border-radius:18px;color:inherit;text-align:left;display:flex;align-items:center;gap:12px;position:relative;isolation:isolate;transform:translateZ(0);transition:transform .16s ease-out;border:1px solid rgba(255,255,255,.16);border-top-color:rgba(255,255,255,.28);background:linear-gradient(135deg,rgba(255,255,255,.115),rgba(255,255,255,.035) 55%,rgba(255,255,255,.07));-webkit-backdrop-filter:blur(24px) saturate(155%);backdrop-filter:blur(24px) saturate(155%);box-shadow:inset 0 1px rgba(255,255,255,.13),0 10px 25px #0008,0 0 20px color-mix(in srgb,var(--c) 18%,transparent)}
.track:after{content:"";position:absolute;z-index:-1;left:9%;right:9%;bottom:-6px;height:14px;border-radius:50%;background:var(--c);filter:blur(14px);opacity:.56} .track:active{transform:translateZ(0) scale(.975)} .track.mix{--c:var(--amber)} .track.ready{--c:var(--green)}
.track-led{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c),0 0 17px var(--c)} .track-copy{min-width:0;flex:1} small{display:block;color:#7f8794;font:9px ui-monospace,monospace;letter-spacing:.16em} strong{display:block;margin-top:3px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-state{font:9px ui-monospace,monospace;color:#aeb5c0;background:#090b0f99;border:1px solid #333842;padding:6px 7px;border-radius:6px;white-space:nowrap}
/* shared-element clone */
.morph{position:fixed;z-index:90;margin:0;pointer-events:none;will-change:transform,width,height,left,top,border-radius;transition:left .46s cubic-bezier(.2,.78,.2,1),top .46s cubic-bezier(.2,.78,.2,1),width .46s cubic-bezier(.2,.78,.2,1),height .46s cubic-bezier(.2,.78,.2,1),border-radius .46s cubic-bezier(.2,.78,.2,1),opacity .18s ease .30s}
.overlay{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(2,3,5,.35);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;transition:opacity .26s ease}
.overlay.open{display:flex} .overlay.visible{opacity:1}
.detail{--c:var(--red);width:min(100%,680px);min-height:54%;padding:18px 18px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;border:1px solid rgba(255,255,255,.20);border-bottom:0;background:linear-gradient(145deg,rgba(34,37,45,.96),rgba(12,14,19,.96));-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);box-shadow:inset 0 1px rgba(255,255,255,.18),0 -10px 55px #000b,0 0 40px color-mix(in srgb,var(--c) 20%,transparent);opacity:0;transform:translate3d(0,105%,0);will-change:transform,opacity;transition:transform .52s cubic-bezier(.22,.82,.24,1),opacity .16s ease-out}
.overlay.visible .detail{opacity:1;transform:translate3d(0,0,0)} .handle{width:42px;height:5px;border-radius:9px;background:#ffffff35;margin:0 auto 22px} .detail-head{display:flex;align-items:center;gap:12px} .bigled{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c),0 0 24px var(--c)} .detail h2{font-size:28px;margin:4px 0 0} .channel{font:10px ui-monospace,monospace;color:#858d99;letter-spacing:.18em}
.steps{display:grid;gap:12px;margin-top:28px} .step{-webkit-appearance:none;appearance:none;border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.035));color:#d9dde4;border-radius:18px;padding:18px;text-align:left;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800} .step span{font:10px ui-monospace,monospace;color:#8e96a2} .step.done{border-color:#55e39a66;background:#55e39a18;color:#dffff0} .close{margin-top:20px;width:100%;border:0;background:transparent;color:#89919e;padding:14px;font-weight:700}
/* V1 disco */
.detail.disco{animation:v1Disco 1.65s ease both} @keyframes v1Disco{0%{--c:#111;transform:scale(1)}12%{--c:var(--pink);transform:scale(.99)}28%{--c:var(--cyan);transform:scale(1.012)}44%{--c:var(--gold)}60%{--c:var(--violet);transform:scale(1.018)}76%{--c:var(--cyan)}100%{--c:var(--green);transform:scale(1)}}
.note{text-align:center;color:#656d79;font-size:11px;margin-top:22px}
@media(prefers-reduced-motion:reduce){.morph,.overlay,.detail,#projectView.show{transition:none;animation:none}}

/* HQ V3.2 — long press editor */
.press-menu{position:fixed;z-index:130;min-width:220px;padding:8px;border-radius:20px;opacity:0;transform:translate3d(0,8px,0) scale(.97);transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .14s ease;background:rgba(24,27,34,.88);border:1px solid rgba(255,255,255,.19);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);box-shadow:0 18px 55px #000c,inset 0 1px rgba(255,255,255,.14)}
.press-menu.show{opacity:1;transform:translate3d(0,0,0) scale(1)}
.press-menu button{display:block;width:100%;min-height:46px;border:0;border-bottom:1px solid rgba(255,255,255,.09);background:transparent;color:#f3f5f8;text-align:left;padding:0 13px;font-size:14px;font-weight:700}.press-menu button:last-child{border-bottom:0}.press-menu .danger{color:#ff7c89}
.editor-shade{position:fixed;inset:0;z-index:140;display:none;align-items:flex-end;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity .18s}.editor-shade.open{display:flex}.editor-shade.show{opacity:1}
.editor{width:100%;max-width:680px;margin:0 auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:rgba(25,28,35,.96);border:1px solid rgba(255,255,255,.18);box-shadow:0 -18px 60px #000b;transform:translate3d(0,100%,0);transition:transform .32s cubic-bezier(.2,.8,.2,1)}.editor-shade.show .editor{transform:none}
.editor h3{margin:4px 0 14px;font-size:19px}.editor input{width:100%;font-size:16px;color:white;background:#0c0e13;border:1px solid #343944;border-radius:14px;padding:14px;outline:none}.editor-actions{display:flex;gap:10px;margin-top:12px}.editor-actions button{flex:1;min-height:46px;border-radius:14px;border:1px solid #363c47;background:#171a20;color:#e9edf3;font-weight:800}.editor-actions .save{background:#f0f2f6;color:#111;border-color:#f0f2f6}
.tasks{display:grid;gap:9px;margin-top:20px}.task{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:rgba(255,255,255,.045);font-size:13px}.task input{width:20px;height:20px;accent-color:#55e39a}.task.done span{text-decoration:line-through;color:#777f8b}
.task-label{margin-top:24px;color:#858d99;font:10px ui-monospace,monospace;letter-spacing:.16em}

#hqHome{max-width:680px;margin:auto;padding:34px 18px 110px;min-height:100vh}.home-shell{border:1px solid #ffffff24;border-radius:30px;background:radial-gradient(circle at 14% 4%,#3e679730,transparent 29%),linear-gradient(150deg,#161a22fa,#080a0ffe 60%);padding:25px 20px 118px;min-height:calc(100vh - 68px);position:relative}.home-brand{font-size:10px;letter-spacing:.34em;font-weight:850;color:#a8afbc}.home-top{display:flex;justify-content:space-between;margin-top:14px}.home-day{font-size:42px;font-weight:850;letter-spacing:-.045em}.home-date{text-align:right}.home-date b{display:block;font-size:52px;font-weight:350;line-height:.9}.home-date span{display:block;margin-top:14px;font-size:11px;letter-spacing:.28em;color:#a0a6b2;font-weight:800}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:42px}.wd{text-align:center;color:#7e8694;font-size:11px;font-weight:800}.dn{text-align:center;padding:13px 0;border:1px solid transparent;border-radius:18px;font-size:18px;font-weight:700;margin-top:6px}.dn.today{background:#ffffff17;border-color:#ffffff2e;box-shadow:0 0 25px #63aaff1f}.today-head{display:flex;justify-content:space-between;align-items:center;margin-top:30px}.today-head h2{margin:0;font-size:22px}.today-head span{font-size:11px;letter-spacing:.15em;color:#858d9a;font-weight:800}.empty-day{margin-top:18px;padding:28px 20px;border-radius:24px;text-align:center;color:#858d99;font-size:13px;border:1px solid #ffffff21;background:linear-gradient(135deg,#ffffff13,#ffffff06);backdrop-filter:blur(22px)}.empty-day strong{display:block;color:#dfe3ea;font-size:16px;margin-bottom:5px}.navdock{position:absolute;left:20px;right:20px;bottom:18px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border-radius:24px;background:#14161cd1;border:1px solid #ffffff24;backdrop-filter:blur(28px)}.navdock button{border:0;background:transparent;color:#8d95a4;border-radius:18px;padding:11px 4px 9px;font-size:9px;font-weight:800}.navdock button.active{background:#ffffff1c;color:#fff}.navico{display:block;font-size:19px;margin-bottom:8px}
/* HQ RACK — CTRL ROOM glass + ticker */
.project,.album-status,.track{background:radial-gradient(circle at 14% 0%,rgba(83,216,255,.07),transparent 32%),linear-gradient(145deg,rgba(23,30,40,.90),rgba(8,11,16,.92) 62%);border:1px solid rgba(180,205,235,.28);border-top-color:rgba(255,255,255,.42);box-shadow:inset 0 1px rgba(255,255,255,.18),0 13px 30px rgba(0,0,0,.48),0 0 22px color-mix(in srgb,var(--c,var(--violet)) 10%,transparent)}
.track{min-height:92px;border-radius:23px;padding:15px 17px}.track-copy{overflow:hidden}.track strong{font-size:18px}.track-state{display:none}
.track-ticker{overflow:hidden;height:17px;margin-top:7px;max-width:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track-ticker-inner{display:inline-block;min-width:max-content;white-space:nowrap;color:#8f98a8;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.track-ticker-inner.scroll{animation:hqTicker var(--ticker-speed,9s) linear infinite}@keyframes hqTicker{from{transform:translateX(var(--ticker-from,0px))}to{transform:translateX(var(--ticker-to,-180px))}}
.track.ready{animation:readyBreath 2.8s ease-in-out infinite}.track.ready .track-led{animation:readyLed 2.8s ease-in-out infinite}
@keyframes readyBreath{0%,100%{box-shadow:inset 0 1px rgba(255,255,255,.18),0 13px 30px rgba(0,0,0,.48),0 0 17px rgba(85,227,154,.10)}50%{box-shadow:inset 0 1px rgba(255,255,255,.22),0 15px 34px rgba(0,0,0,.52),0 0 28px rgba(85,227,154,.24)}}
@keyframes readyLed{0%,100%{opacity:.78;transform:scale(.92)}50%{opacity:1;transform:scale(1.12);box-shadow:0 0 9px var(--green),0 0 24px rgba(85,227,154,.72)}}

/* HQ RACK V2.1 — alignment, READY signature, album art */
.track-copy{min-width:0;overflow:hidden}
.track-ticker{
  margin-left:0!important;
  padding-left:0!important;
  width:100%;
  max-width:100%;
  -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 91%,transparent 100%);
  mask-image:linear-gradient(90deg,#000 0%,#000 91%,transparent 100%);
}
.track-ticker-inner{padding-left:0!important}

/* Permanent READY identity */
.track.ready{
  border-color:rgba(85,227,154,.55)!important;
  border-top-color:rgba(198,255,226,.72)!important;
  background:
    radial-gradient(circle at 12% 18%,rgba(85,227,154,.12),transparent 35%),
    linear-gradient(145deg,rgba(16,37,31,.92),rgba(7,14,14,.94) 62%)!important;
  box-shadow:
    inset 0 1px rgba(220,255,238,.22),
    0 13px 30px rgba(0,0,0,.48),
    0 0 28px rgba(85,227,154,.22)!important;
}
.track.ready .track-ticker-inner{color:#9de9bf}
.track.ready strong{color:#effff6}
.track.ready .track-led{background:var(--green);box-shadow:0 0 8px var(--green),0 0 22px rgba(85,227,154,.72)}
.track.ready.just-ready{overflow:hidden}
.track.ready.just-ready:before{
  content:"";position:absolute;z-index:2;top:-20%;bottom:-20%;width:38%;
  left:-48%;pointer-events:none;transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(183,255,218,.30),transparent);
  filter:blur(3px);animation:readySweep 1.15s cubic-bezier(.2,.72,.2,1) 1;
}
.track.ready.just-ready .track-led{animation:readyTriple .95s ease-out 1}
@keyframes readySweep{to{left:115%}}
@keyframes readyTriple{
  0%,100%{transform:scale(1)}
  18%{transform:scale(1.55)}
  34%{transform:scale(1)}
  52%{transform:scale(1.45)}
  68%{transform:scale(1)}
  84%{transform:scale(1.35)}
}

/* Album art */
.album-art-wrap{margin:18px 0 20px}
.album-art{
  -webkit-appearance:none;appearance:none;width:100%;aspect-ratio:16/8.6;
  border-radius:27px;overflow:hidden;position:relative;padding:0;color:#eaf0f8;
  border:1px solid rgba(183,207,235,.28);border-top-color:rgba(245,250,255,.50);

    radial-gradient(circle at 20% 0%,rgba(83,216,255,.11),transparent 36%),

.album-art:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 1px rgba(255,255,255,.18)}
.album-placeholder{position:absolute;inset:0;display:grid;place-content:center;gap:8px;transition:opacity .2s}
.album-placeholder .art-icon{
  width:54px;height:54px;margin:auto;border-radius:17px;display:grid;place-items:center;
  border:1px solid rgba(198,221,246,.28);background:rgba(255,255,255,.045);
  font-size:23px;color:#a9b7ca
}
.album-placeholder b{font-size:14px;letter-spacing:.04em}
.album-placeholder span{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#7f8a9b;letter-spacing:.14em}
.art-actions{display:none;position:absolute;right:12px;bottom:12px;z-index:4}
.album-art.has-art .art-actions{display:block}
.art-actions span{display:block;padding:8px 11px;border-radius:999px;background:rgba(5,8,12,.62);border:1px solid rgba(255,255,255,.20);-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);font:9px ui-monospace,monospace;letter-spacing:.10em;color:#eef4fb}
#albumArtInput{display:none}


/* === THE RACK CONCEPT PASS === */
:root{--rack-pink:#ff3f91;--rack-green:#36f59a;--rack-amber:#ffad36;--rack-red:#ff405f}
body{background:radial-gradient(circle at 50% 18%,rgba(0,139,190,.055),transparent 28%),radial-gradient(circle at 50% 78%,rgba(255,42,119,.045),transparent 30%),#02060a}
.album-art-wrap{margin:12px 0!important}
.album-art{aspect-ratio:3.15/1!important;max-height:118px!important;border-radius:20px!important}
.album-placeholder{gap:5px!important}.album-placeholder .art-icon{width:38px!important;height:38px!important;border-radius:11px!important;font-size:17px!important}.album-placeholder b{font-size:11px!important}.album-placeholder span{font-size:7px!important}
.album-status{padding:12px 14px!important;border-radius:17px!important;margin:10px 0!important}.album-status .row{font-size:10px!important}.bar{height:5px!important;margin-top:8px!important}
.track-list,.tracks{gap:7px!important}
.track{min-height:0!important;height:68px!important;border-radius:16px!important;padding:9px 12px!important;grid-template-columns:28px minmax(0,1fr) auto!important;gap:9px!important}
.track-led{width:13px!important;height:13px!important}.track small{font-size:8px!important;letter-spacing:.16em!important;margin-bottom:3px!important}.track strong{font-size:14px!important;line-height:1.05!important}
.track-ticker{height:14px!important;margin-top:4px!important}.track-ticker-inner{font-size:8px!important;letter-spacing:.04em!important;color:#8c96a7!important}
.track-state{display:flex!important;align-items:center!important;gap:5px!important}
.track.ready{border-color:rgba(55,255,158,.58)!important;background:linear-gradient(105deg,rgba(8,38,27,.95),rgba(5,17,17,.97) 60%,rgba(8,37,26,.9))!important;box-shadow:inset 0 1px rgba(195,255,222,.28),0 0 10px rgba(50,255,151,.27),0 0 30px rgba(50,255,151,.20),0 9px 22px rgba(0,0,0,.46)!important}
.track.ready:after{content:"";position:absolute;inset:auto 10% -15px 10%;height:27px;background:radial-gradient(ellipse,rgba(46,255,145,.42),transparent 68%);filter:blur(9px);pointer-events:none}
.track.ready .track-led{background:var(--rack-green)!important;box-shadow:0 0 7px #42ff9e,0 0 17px rgba(54,245,154,.95),0 0 30px rgba(54,245,154,.55)!important}
.track.ready .track-state{color:#c5ffdf!important;border:1px solid rgba(65,255,160,.38);background:rgba(31,255,135,.09);border-radius:999px;padding:5px 8px;font-size:7px!important;letter-spacing:.1em}
.track.partial .track-led{background:var(--rack-amber)!important;box-shadow:0 0 7px var(--rack-amber),0 0 16px rgba(255,173,54,.45)!important}
@media(max-width:430px){.wrap,.shell,main{padding-left:14px!important;padding-right:14px!important}}


/* === TICKER FIX === */
.track-copy{
  min-width:0!important;
  flex:1 1 auto!important;
  overflow:hidden!important;
  align-self:center!important;
}
.track-ticker{
  display:block!important;
  position:relative!important;
  width:100%!important;
  height:12px!important;
  line-height:12px!important;
  margin:3px 0 0 0!important;
  padding:0!important;
  overflow:hidden!important;
  -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 88%,transparent 100%)!important;
  mask-image:linear-gradient(90deg,#000 0%,#000 88%,transparent 100%)!important;
}
.track-ticker-inner{
  display:block!important;
  width:max-content!important;
  min-width:0!important;
  padding:0!important;
  margin:0!important;

  from{transform:translate3d(0,0,0)}

/* Don't let the right badge crush the task line */
.track-state{flex:0 0 auto!important;margin-left:4px!important}

/* === READY GLOW — approved concept reference === */
.track.ready{
  position:relative!important; isolation:isolate!important; overflow:visible!important;
  border:1px solid rgba(74,255,163,.78)!important;
  background:
    radial-gradient(ellipse at 14% 52%,rgba(37,255,143,.25),transparent 34%),
    radial-gradient(ellipse at 70% 120%,rgba(28,255,137,.18),transparent 44%),
    linear-gradient(105deg,rgba(7,46,29,.97),rgba(4,19,17,.98) 57%,rgba(6,36,25,.96))!important;
  box-shadow:
    inset 0 1px 0 rgba(220,255,235,.36),
    inset 0 0 24px rgba(40,255,143,.11),
    0 0 7px rgba(67,255,160,.78),
    0 0 19px rgba(42,255,145,.53),
    0 0 40px rgba(27,255,133,.34),
    0 10px 28px rgba(0,0,0,.56)!important;
}
.track.ready::before{
  content:""!important; position:absolute!important; z-index:-1!important;
  left:2%!important; right:2%!important; bottom:-19px!important; height:36px!important;
  border-radius:50%!important;
  background:radial-gradient(ellipse at center,rgba(45,255,145,.70) 0%,rgba(28,255,137,.36) 34%,rgba(18,255,126,.12) 59%,transparent 77%)!important;
  filter:blur(10px)!important; opacity:1!important; pointer-events:none!important;
}
.track.ready::after{
  content:""!important; position:absolute!important; z-index:0!important; inset:1px!important;
  border-radius:inherit!important;
  background:
    radial-gradient(circle at 10% 50%,rgba(112,255,185,.24),transparent 17%),
    linear-gradient(110deg,transparent 50%,rgba(84,255,171,.09) 73%,transparent 91%)!important;
  pointer-events:none!important;
}
.track.ready .track-led{
  position:relative!important; z-index:2!important; background:#4dffa6!important;
  border-color:rgba(220,255,236,.82)!important;
  box-shadow:0 0 4px #c4ffdc,0 0 10px #43ff9d,0 0 22px rgba(52,255,151,.98),0 0 40px rgba(32,255,137,.66)!important;
}
.track.ready .track-copy,.track.ready .track-state,.track.ready .arrow{position:relative!important;z-index:2!important}
.track.ready strong{color:#f5fff9!important;text-shadow:0 0 13px rgba(105,255,178,.18)!important}
.track.ready .track-ticker-inner{color:#a8d9bd!important}
.track.ready .track-state{
  color:#d8ffe8!important;
  border:1px solid rgba(80,255,166,.68)!important;
  background:linear-gradient(180deg,rgba(43,255,146,.20),rgba(17,145,84,.11))!important;
  box-shadow:inset 0 1px rgba(225,255,238,.22),0 0 9px rgba(47,255,150,.46),0 0 20px rgba(35,255,139,.26)!important;
}
.track.ready.just-ready{animation:readyArrival 1.15s cubic-bezier(.2,.75,.2,1) 1!important}
@keyframes readyArrival{0%{filter:brightness(1)}32%{filter:brightness(1.6)}62%{filter:brightness(1.14)}100%{filter:brightness(1)}}

<script>
(function(){
let names=["Nah Nah Nah", "BS&S", "Högre", "95", "Rikedom", "Rap", "Click Clack", "Jag vill upp", "Ryssen kommer", "Ålderskris", "Ha ha ha", "På din dörr", "Maskotar", "Ondskan", "Skiner", "Hicka/Dubai", "Svart bälte", "Panenka", "Champion", "Värdefullt"], KEY="hq-rack-v3";
let data={}, current=null, sourceCard=null, busy=false, editIndex=null, editMode=null, pressTimer=null, pressStart=null;
let meta={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
try{meta=JSON.parse(localStorage.getItem(KEY+"-meta")||"{}")}catch(e){}
names=names.map((n,i)=>meta[i]&&meta[i].name?meta[i].name:n);
const $=s=>document.querySelector(s), cards=[...document.querySelectorAll(".track")], overlay=$("#overlay"), detail=$("#detail");
const state=i=>data[i]||{mix:false,master:false};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(KEY+"-meta",JSON.stringify(meta))}catch(e){}}
function tasksFor(i){return meta[i]&&Array.isArray(meta[i].tasks)?meta[i].tasks:[]}

function tickerText(i){
 const x=state(i),pending=tasksFor(i).filter(t=>!t.done).map(t=>t.text),parts=[...pending];
 if(!x.mix)parts.push("MIX");else if(!x.master)parts.push("MASTER");
 return parts.length?parts.join("   •   "):"✓ READY";
}
function setTicker(el,text){
  el.classList.remove("scroll");
  el.style.removeProperty("--ticker-distance");
  el.style.removeProperty("--ticker-speed");
  el.textContent=text;
  requestAnimationFrame(()=>{
    const box=el.parentElement;
    if(!box)return;
    const natural=el.scrollWidth;
    if(natural>box.clientWidth+3){
      el.innerHTML='<span class="ticker-copy"></span><span class="ticker-copy"></span>';
      el.children[0].textContent=text+"   •   ";
      el.children[1].textContent=text+"   •   ";
      const distance=el.children[0].getBoundingClientRect().width;
      el.style.setProperty("--ticker-distance",(-distance)+"px");
      el.style.setProperty("--ticker-speed",Math.max(8,distance/22)+"s");
      el.classList.add("scroll");
    }
  });
}

const ART_DB="hq-media-v1", ART_STORE="covers", ART_KEY="blodstank-skalar";
function artDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(ART_DB,1);
  r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(ART_STORE))db.createObjectStore(ART_STORE)};
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}
async function saveArt(blob){
 const db=await artDB();
 await new Promise((resolve,reject)=>{const tx=db.transaction(ART_STORE,"readwrite");tx.objectStore(ART_STORE).put(blob,ART_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
 db.close();
}
async function loadArt(){
 try{
  const db=await artDB();
  const blob=await new Promise((resolve,reject)=>{const tx=db.transaction(ART_STORE,"readonly");const r=tx.objectStore(ART_STORE).get(ART_KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
  db.close();
  if(blob){const img=$("#albumArtImage"),btn=$("#albumArtButton");img.src=URL.createObjectURL(blob);btn.classList.add("has-art")}
 }catch(e){}
}
function celebrateReady(i){
 const c=cards[i];if(!c)return;
 c.classList.remove("just-ready");void c.offsetWidth;c.classList.add("just-ready");
 setTimeout(()=>c.classList.remove("just-ready"),1250);
 try{navigator.vibrate&&navigator.vibrate([20,55,20])}catch(e){}
}

function paint(){
 let ready=0;
 cards.forEach((c,i)=>{c.querySelector("strong").textContent=names[i];let x=state(i);c.classList.toggle("mix",x.mix&&!x.master);c.classList.toggle("ready",x.mix&&x.master);c.classList.toggle("partial",(x.mix||x.master)&&!(x.mix&&x.master));c.querySelector(".track-state").textContent=x.mix&&x.master?"● READY":x.mix?"MASTER":"MIX";setTicker(c.querySelector(".track-ticker-inner"),tickerText(i));if(x.mix&&x.master)ready++;});
 $("#count").textContent=ready+" / "+names.length+" READY";$("#homeCount").textContent=ready+" / "+names.length+" READY";
 $("#fill").style.width=$("#homeFill").style.width=(ready/names.length*100)+"%";
 if(current!==null)paintDetail();
}
function paintDetail(){
 let x=state(current), c=x.mix&&x.master?"#55e39a":x.mix?"#ffb14e":"#ff6477";detail.style.setProperty("--c",c);
 $("#dchannel").textContent="CHANNEL "+String(current+1).padStart(2,"0");$("#dname").textContent=names[current];
 const box=$("#tasks"), ts=tasksFor(current);box.innerHTML="";
 if(!ts.length){box.innerHTML='<div style="color:#6f7783;font-size:12px;padding:3px 2px">Inga extra uppgifter</div>'}
 ts.forEach((t,j)=>{let lab=document.createElement("label");lab.className="task"+(t.done?" done":"");let cb=document.createElement("input");cb.type="checkbox";cb.checked=!!t.done;let sp=document.createElement("span");sp.textContent=t.text;cb.addEventListener("change",()=>{t.done=cb.checked;save();paint();try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}});lab.append(cb,sp);box.appendChild(lab)});
 [["#mix","mix"],["#master","master"]].forEach(a=>{let b=$(a[0]),on=x[a[1]];b.classList.toggle("done",on);b.querySelector("span").textContent=on?"✓ READY":"NOT READY"});
}
function openTrack(card,i){
 if(busy)return;busy=true;current=i;sourceCard=card;paintDetail();
 overlay.classList.add("open");
 requestAnimationFrame(()=>requestAnimationFrame(()=>overlay.classList.add("visible")));
 setTimeout(()=>{busy=false},500);
}
function closeTrack(){
 if(busy)return;busy=true;overlay.classList.remove("visible");
 setTimeout(()=>{overlay.classList.remove("open");current=null;sourceCard=null;busy=false},540);
}
function haptic(ms=18){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function hideMenu(){const m=$("#pressMenu");m.classList.remove("show");setTimeout(()=>{m.style.display="none"},160)}
function showMenu(card,i,x,y){
 editIndex=i;const m=$("#pressMenu");m.style.display="block";
 const w=230,left=Math.max(12,Math.min(window.innerWidth-w-12,x-w/2)),top=Math.max(70,Math.min(window.innerHeight-130,y+10));
 m.style.left=left+"px";m.style.top=top+"px";requestAnimationFrame(()=>m.classList.add("show"));haptic(30);
}
cards.forEach((c,i)=>{
 let longed=false;
 c.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;longed=false;pressStart={x:e.clientX,y:e.clientY};clearTimeout(pressTimer);pressTimer=setTimeout(()=>{longed=true;showMenu(c,i,e.clientX,e.clientY)},520)});
 c.addEventListener("pointermove",e=>{if(pressStart&&Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>12)clearTimeout(pressTimer)});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>c.addEventListener(ev,()=>clearTimeout(pressTimer)));
 c.addEventListener("click",e=>{if(longed){e.preventDefault();e.stopPropagation();longed=false;return}openTrack(c,i)});
});
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#pressMenu")&&!e.target.closest(".track"))hideMenu()});
$("#pressMenu").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;editMode=b.dataset.act;hideMenu();
 $("#editorTitle").textContent=editMode==="rename"?"Byt namn på låten":"Lägg till uppgift";
 $("#editorInput").value=editMode==="rename"?names[editIndex]:"";
 const sh=$("#editorShade");sh.classList.add("open");requestAnimationFrame(()=>sh.classList.add("show"));setTimeout(()=>$("#editorInput").focus(),260);
});
function closeEditor(){const sh=$("#editorShade");sh.classList.remove("show");setTimeout(()=>sh.classList.remove("open"),330)}
$("#editorCancel").addEventListener("click",closeEditor);
$("#editorSave").addEventListener("click",()=>{
 const v=$("#editorInput").value.trim();if(!v)return;
 meta[editIndex]=meta[editIndex]||{tasks:[]};meta[editIndex].tasks=meta[editIndex].tasks||[];
 if(editMode==="rename"){meta[editIndex].name=v;names[editIndex]=v}else meta[editIndex].tasks.push({text:v,done:false});
 save();paint();haptic(16);closeEditor();
});
$("#editorInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("#editorSave").click()});
$("#close").addEventListener("click",closeTrack);overlay.addEventListener("click",e=>{if(e.target===overlay)closeTrack()});
$("#mix").addEventListener("click",()=>{let x=state(current);x.mix=!x.mix;if(!x.mix)x.master=false;data[current]=x;save();paint()});
$("#master").addEventListener("click",()=>{let i=current,x=state(i),was=x.mix&&x.master;if(!x.master){x.mix=true;x.master=true}else x.master=false;data[i]=x;save();paint();if(!was&&x.mix&&x.master){celebrateReady(i);detail.classList.remove("disco");void detail.offsetWidth;detail.classList.add("disco");setTimeout(()=>{detail.classList.remove("disco");paintDetail()},1100)}});
$("#openProject").addEventListener("click",()=>{const h=$("#rackHome"),p=$("#projectView");h.animate([{opacity:1,transform:"scale(1)"},{opacity:0,transform:"scale(.985)"}],{duration:260,easing:"ease-out"}).onfinish=()=>{h.style.display="none";p.classList.add("show");window.scrollTo(0,0)}});
$("#back").addEventListener("click",()=>{const h=$("#rackHome"),p=$("#projectView");p.classList.remove("show");p.style.display="none";h.style.display="block";h.animate([{opacity:0,transform:"translateY(-6px)"},{opacity:1,transform:"none"}],{duration:300,easing:"cubic-bezier(.2,.75,.25,1)"});window.scrollTo(0,0)});

const artBtn=$("#albumArtButton"),artInput=$("#albumArtInput");
if(artBtn&&artInput){
 artBtn.addEventListener("click",()=>artInput.click());
 artInput.addEventListener("change",async()=>{
  const file=artInput.files&&artInput.files[0];if(!file)return;
  if(!file.type.startsWith("image/"))return;
  try{await saveArt(file);const img=$("#albumArtImage");img.src=URL.createObjectURL(file);artBtn.classList.add("has-art");haptic(18)}catch(e){}
 });
 loadArt();
}

paint();
})();
</script></body></html>
