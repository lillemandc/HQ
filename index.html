<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HQ · CTRL ROOM</title><link rel="stylesheet" href="shared/hq.css"></head><body><main class="shell"><div class="ey">HQ</div><h1>CTRL ROOM</h1><p id="date" class="muted"></p><section class="glass hero"><div class="label">NU</div><h2>Allt samlat. En sak i taget.</h2><p>Fånga det som snurrar i huvudet först. Sortera senare.</p><button id="capture">＋ CAPTURE</button></section><div class="head"><b>NEXT</b><span id="count">0</span></div><div id="next" class="glass card muted">Ingen nästa åtgärd vald ännu.</div><div class="head"><b>INBOX</b><button id="clear" class="link">RENSA</button></div><div id="inbox"></div><nav class="grid"><a class="glass" href="calendar/index.html"><b>CALENDAR</b><span>Din kalender</span></a><a class="glass" href="rack/index.html"><b>THE RACK</b><span>Musikprojekt</span></a><a class="glass" href="workspace/index.html"><b>WORKSPACE</b><span>Jobb</span></a><a class="glass" href="home/index.html"><b>HOME</b><span>Privat</span></a></nav></main><div id="wrap"><div id="scrim"></div><div class="sheet glass"><div class="head"><b>CAPTURE</b><button id="close" class="link">STÄNG</button></div><h2>Vad behöver HQ veta?</h2><textarea id="input" rows="4" placeholder="Skriv precis som du tänker…"></textarea><div class="chips"><button>MUSIK</button><button>JOBB</button><button>PRIVAT</button><button class="active">OSORTERAT</button></div><button id="save">SPARA I HQ</button></div></div><script>
const $=s=>document.querySelector(s),K="hq_core_v1_inbox";let area="OSORTERAT";const load=()=>{try{return JSON.parse(localStorage.getItem(K)||"[]")}catch{return[]}},store=a=>localStorage.setItem(K,JSON.stringify(a));function render(){let a=load();$("#count").textContent=a.length;$("#next").textContent=a.length?a[0].text:"Ingen nästa åtgärd vald ännu.";$("#inbox").innerHTML=a.length?a.map((x,i)=>`<div class="glass item"><div><em>${x.area}</em><p>${x.text.replace(/</g,"&lt;")}</p></div><button class="done" data-i="${i}">✓</button></div>`).join(""):'<div class="glass card muted">Inbox är tom. Bra läge.</div>';document.querySelectorAll(".done").forEach(b=>b.onclick=()=>{a.splice(+b.dataset.i,1);store(a);render()})}$("#capture").onclick=()=>$("#wrap").classList.add("open");$("#close").onclick=$("#scrim").onclick=()=>$("#wrap").classList.remove("open");document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{area=b.textContent;document.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("active",x===b))});$("#save").onclick=()=>{let t=$("#input").value.trim();if(!t)return;let a=load();a.unshift({text:t,area,created:new Date().toISOString()});store(a);$("#input").value="";$("#wrap").classList.remove("open");render()};$("#clear").onclick=()=>{if(confirm("Rensa hela Inbox?")){store([]);render()}};$("#date").textContent=new Date().toLocaleDateString("sv-SE",{weekday:"long",day:"numeric",month:"long"}).toUpperCase();render();</script></body></html>
