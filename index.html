<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>HQ</title>
<style>
:root{--bg:#07090d;--line:rgba(255,255,255,.11);--muted:#858e9b;--work:#55a7ff;--music:#b47cff;--private:#ffb14e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}button,input{font:inherit}
body{background:radial-gradient(circle at 8% 0%,#14202d 0,transparent 28%),radial-gradient(circle at 95% 18%,#1d152a 0,transparent 31%),#07090d}
.app{max-width:680px;margin:auto;min-height:100vh;padding:calc(25px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.kicker{font:800 10px ui-monospace,SFMono-Regular,monospace;letter-spacing:.27em;color:#929aa8}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-top:12px}.weekday{font-size:40px;font-weight:850;letter-spacing:-.045em}.datebox{text-align:right}.datebox b{display:block;font-size:50px;line-height:.9;font-weight:350}.datebox span{display:block;margin-top:13px;font-size:11px;letter-spacing:.27em;color:#a1a8b4;font-weight:800}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-top:36px}.viewtoggle{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:14px;padding:4px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.035)}.viewtoggle button{border:0;border-radius:11px;background:transparent;color:#7f8895;min-height:38px;font-size:11px;font-weight:850}.viewtoggle button.active{background:rgba(255,255,255,.11);color:#fff}.monthtitle{font-size:25px;font-weight:850;letter-spacing:-.025em}.monthnav{display:flex;gap:8px}.circle{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.065);color:white;font-size:23px}
.calendar{margin-top:17px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.025);box-shadow:0 18px 55px #0007}
.weekhead,.weekrow{display:grid;grid-template-columns:38px repeat(7,1fr)}.weekhead{background:rgba(255,255,255,.035)}.weekhead div{padding:10px 0;text-align:center;color:#77808d;font-size:10px;font-weight:850}.weekhead .vh{color:#aab2be}
.weekno{display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);border-right:1px solid var(--line);color:#9ba5b2;font:850 9px ui-monospace,monospace;background:rgba(255,255,255,.035)}
.day{position:relative;min-width:0;height:67px;border:0;border-top:1px solid var(--line);border-right:1px solid var(--line);background:transparent;color:#e9edf3;text-align:center;padding:7px 2px;-webkit-tap-highlight-color:transparent}.day:last-child{border-right:0}.day.other{color:#4e5662}.day:active{background:rgba(255,255,255,.1)}.num{display:flex;width:29px;height:29px;margin:auto;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:750}.day.today .num{background:#f0f3f7;color:#0b0d12;box-shadow:0 0 22px rgba(110,171,255,.28)}.day.selected{background:rgba(255,255,255,.075);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
.dots{position:absolute;left:3px;right:3px;bottom:8px;display:flex;gap:3px;justify-content:center}.dot{width:5px;height:5px;border-radius:50%}.dot.JOBB{background:var(--work);box-shadow:0 0 8px var(--work)}.dot.MUSIK{background:var(--music);box-shadow:0 0 8px var(--music)}.dot.PRIVAT{background:var(--private);box-shadow:0 0 8px var(--private)}
.todaysec{margin-top:27px}.todayhead{display:flex;align-items:center;justify-content:space-between}.todayhead h2{margin:0;font-size:21px}.todayhead span{font-size:10px;letter-spacing:.15em;color:#818a97;font-weight:800}.empty{margin-top:14px;padding:24px 18px;text-align:center;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:#7f8794;font-size:12px}.empty strong{display:block;color:#dfe4eb;font-size:15px;margin-bottom:5px}
.event{display:flex;align-items:center;gap:12px;margin-top:9px;padding:14px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.045)}.event.JOBB{border-left:3px solid var(--work)}.event.MUSIK{border-left:3px solid var(--music)}.event.PRIVAT{border-left:3px solid var(--private)}.eventtime{font:750 13px ui-monospace,monospace}.event small{display:block;color:#7f8895;margin-top:2px}
.dock{position:fixed;z-index:20;left:max(16px,calc((100vw - 648px)/2));right:max(16px,calc((100vw - 648px)/2));bottom:calc(13px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:7px;border:1px solid rgba(255,255,255,.14);border-radius:23px;background:rgba(20,22,28,.86);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%)}.dock button{border:0;border-radius:17px;background:transparent;color:#818a97;padding:10px 3px 8px;font-size:9px;font-weight:850}.dock .active{background:rgba(255,255,255,.1);color:white}.ico{display:block;font-size:18px;margin-bottom:6px}
.sheet{position:fixed;z-index:100;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.48);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}.sheet.open{display:flex}.panel{width:100%;max-width:680px;margin:0 auto;padding:18px 17px calc(22px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:#171a21;border:1px solid rgba(255,255,255,.17);box-shadow:0 -20px 65px #000b;transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1)}.sheet.show .panel{transform:none}.handle{width:42px;height:5px;border-radius:8px;background:#515965;margin:0 auto 17px}.panel h3{font-size:24px;margin:0}.sub{color:#818a97;font-size:12px;margin-top:4px}
.dayevents{display:grid;gap:8px;margin-top:17px}.row{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}.row.JOBB{border-left:3px solid var(--work)}.row.MUSIK{border-left:3px solid var(--music)}.row.PRIVAT{border-left:3px solid var(--private)}.del{border:0;background:transparent;color:#ff7886;font-size:20px}
.form{display:grid;gap:9px;margin-top:18px}.form input{width:100%;border:1px solid #343a45;border-radius:13px;background:#0d1015;color:#fff;padding:13px;font-size:15px;outline:none}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.type{min-height:42px;border-radius:12px;border:1px solid #343a45;background:#10131a;color:#8b94a1;font-size:11px;font-weight:850}.type.sel[data-type="JOBB"]{border-color:var(--work);color:#dceeff;background:rgba(85,167,255,.14)}.type.sel[data-type="MUSIK"]{border-color:var(--music);color:#eee4ff;background:rgba(180,124,255,.14)}.type.sel[data-type="PRIVAT"]{border-color:var(--private);color:#fff0dc;background:rgba(255,177,78,.14)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{min-height:46px;border-radius:13px;border:1px solid #363c47;background:#20242c;color:#e9edf2;font-weight:850}.actions .add{background:#f0f2f6;color:#101216;border-color:#f0f2f6}
.placeholder{display:none;max-width:680px;margin:auto;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 18px}.placeholder.open{display:block}.back{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.065);color:white;font-size:25px}.placeholder h1{font-size:35px}.blank{margin-top:25px;padding:28px;text-align:center;border:1px solid var(--line);border-radius:22px;color:#7e8794}
@media(max-width:390px){.day{height:60px}.weekhead,.weekrow{grid-template-columns:34px repeat(7,1fr)}.weekday{font-size:36px}}

/* HQ premium pass — reference look */
body{
  background:
    radial-gradient(circle at 12% 2%,rgba(36,58,82,.58) 0,rgba(7,9,13,0) 30%),
    radial-gradient(circle at 88% 42%,rgba(41,30,60,.24) 0,rgba(7,9,13,0) 35%),

.app{padding-left:24px;padding-right:24px}
.kicker{color:#a4abb8;letter-spacing:.32em}
.weekday{font-size:44px;font-weight:900;letter-spacing:-.05em}
.datebox b{font-size:58px;font-weight:300;letter-spacing:-.04em}

.monthbar{margin-top:30px}
.monthtitle{font-size:17px;color:#aeb5c0;font-weight:750}

  width:190px;margin:18px 0 12px auto;

}

  font-size:8px!important;align-items:center;
}

}
.day.other{color:#555c68}

}

}
.todaysec{margin-top:26px}
.todayhead h2{font-size:24px;font-weight:900;letter-spacing:-.03em}
.todayhead span{font-size:11px;letter-spacing:.15em;color:#858d9b}

  padding:27px 18px;border-radius:22px;
  background:linear-gradient(145deg,rgba(54,60,72,.62),rgba(27,30,37,.72));

  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 35px rgba(0,0,0,.22);
}
.event{
  min-height:86px;padding:16px 18px;border-radius:23px;
  background:
    linear-gradient(145deg,rgba(68,73,84,.76),rgba(27,30,38,.80));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 14px 35px rgba(0,0,0,.22);
  overflow:hidden;position:relative;
}
.event::after{
  content:"";position:absolute;left:0;right:0;bottom:-28px;height:58px;opacity:.42;filter:blur(16px);
}
.event.JOBB::after{background:var(--work)}
.event.MUSIK::after{background:var(--music)}
.event.PRIVAT::after{background:var(--private)}
.event.JOBB,.event.MUSIK,.event.PRIVAT{border-left:1px solid rgba(255,255,255,.18)}
.eventtime{font-size:16px;min-width:72px;z-index:1}
.event strong{font-size:18px;position:relative;z-index:1}
.event small{font-size:11px;letter-spacing:.06em;position:relative;z-index:1}
.dock{
  left:max(24px,calc((100vw - 632px)/2));right:max(24px,calc((100vw - 632px)/2));
  padding:7px;border-radius:25px;
  background:rgba(22,24,30,.88);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 20px 45px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.06);
}
.dock button{min-height:63px;border-radius:19px;font-size:9px;letter-spacing:.06em}
.dock .active{
  background:linear-gradient(145deg,rgba(83,87,98,.58),rgba(46,49,57,.58));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 18px rgba(0,0,0,.18);
}
.ico{font-size:20px}
.panel{
  background:linear-gradient(180deg,#20242c,#11141a);
  border-color:rgba(255,255,255,.16);
  box-shadow:0 -24px 70px rgba(0,0,0,.72);
}
.row{
  min-height:66px;border-radius:17px;
  background:linear-gradient(145deg,rgba(61,66,77,.62),rgba(26,29,36,.72));
  border-color:rgba(255,255,255,.14);
}
.form input{background:#0d1015;border-color:rgba(255,255,255,.15)}
.type{background:#11141a;border-color:rgba(255,255,255,.14)}


/* HQ liquid glass pass */
.calendar{
  position:relative;padding:7px 7px 9px;border-radius:26px!important;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018))!important;
  border:1px solid rgba(255,255,255,.13)!important;
  -webkit-backdrop-filter:blur(30px) saturate(155%);backdrop-filter:blur(30px) saturate(155%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -1px 0 rgba(255,255,255,.035),0 22px 55px rgba(0,0,0,.30)!important;
}
.calendar:before{content:"";position:absolute;inset:1px;border-radius:25px;pointer-events:none;background:radial-gradient(circle at 16% 0%,rgba(116,177,255,.12),transparent 30%),radial-gradient(circle at 88% 100%,rgba(183,124,255,.08),transparent 31%)}
.viewtoggle,.dock,.event,.empty,.panel,.row{
  -webkit-backdrop-filter:blur(28px) saturate(165%);backdrop-filter:blur(28px) saturate(165%);
}
.day.selected:not(.today){background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.035));box-shadow:inset 0 1px rgba(255,255,255,.15),0 8px 24px rgba(0,0,0,.16)}
.event,.empty{background:linear-gradient(135deg,rgba(103,111,128,.30),rgba(29,33,42,.48))!important}
.event:before,.empty:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.11),transparent 28%,transparent 72%,rgba(255,255,255,.035))}
.empty{position:relative}
.dock{background:linear-gradient(145deg,rgba(42,46,56,.72),rgba(17,20,26,.72))!important}
.panel{background:linear-gradient(155deg,rgba(45,50,61,.94),rgba(15,18,24,.96))!important}
.dayhint{margin-top:15px;color:#6f7886;text-align:center;font-size:10px;letter-spacing:.05em}

</style>
</head>
<body>
<main class="app" id="home">
 <div class="kicker">HQ</div>
 <div class="top"><div class="weekday" id="weekday"></div><div class="datebox"><b id="dateNum"></b><span id="monthTop"></span></div></div>
 <div class="monthbar"><div class="monthtitle" id="monthTitle"></div><div class="monthnav"><button class="circle" id="prev" type="button">‹</button><button class="circle" id="next" type="button">›</button></div></div>
 <div class="viewtoggle"><button id="weekView" class="active" type="button">VECKA</button><button id="monthView" type="button">MÅNAD</button></div><section class="calendar"><div class="weekhead"><div class="vh">V</div><div>M</div><div>T</div><div>O</div><div>T</div><div>F</div><div>L</div><div>S</div></div><div id="grid"></div></section>
 <section class="todaysec"><div class="todayhead"><h2 id="selectedHeading">Idag</h2><span id="todayCount">0 AKTIVITETER</span></div><div id="todayEvents"></div><div class="dayhint">Tryck på en dag · håll inne för att lägga till</div></section>
</main>

<section class="placeholder" id="work"><button class="back" data-back type="button">‹</button><div class="kicker" style="margin-top:18px">HQ // WORKSPACE</div><h1>Jobb</h1><div class="blank">Inget innehåll här ännu.</div></section>
<section class="placeholder" id="music"><button class="back" data-back type="button">‹</button><div class="kicker" style="margin-top:18px">HQ // THE RACK</div><h1>Musik</h1><div class="blank">THE RACK kopplas tillbaka här i nästa steg.</div></section>
<section class="placeholder" id="private"><button class="back" data-back type="button">‹</button><div class="kicker" style="margin-top:18px">HQ // HOME</div><h1>Privat</h1><div class="blank">Inget innehåll här ännu.</div></section>

<nav class="dock" id="dock"><button class="active" data-page="home"><span class="ico">▦</span>KALENDER</button><button data-page="work"><span class="ico">▤</span>JOBB</button><button data-page="music"><span class="ico">◉</span>MUSIK</button><button data-page="private"><span class="ico">⌂</span>PRIVAT</button></nav>

<div class="sheet" id="sheet"><section class="panel"><div class="handle"></div><h3 id="dayTitle"></h3><div class="sub" id="dayWeek"></div><div class="dayevents" id="dayEvents"></div><div class="form"><input id="eventText" placeholder="Ny aktivitet…"><div class="types"><button class="type sel" data-type="PRIVAT" type="button">PRIVAT</button><button class="type" data-type="JOBB" type="button">JOBB</button><button class="type" data-type="MUSIK" type="button">MUSIK</button></div><input id="eventTime" type="time"><div class="actions"><button id="cancel" type="button">Stäng</button><button class="add" id="add" type="button">Lägg till</button></div></div></section></div>

<script>
(()=>{
"use strict";
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
const months=["Januari","Februari","Mars","April","Maj","Juni","Juli","Augusti","September","Oktober","November","December"];
const days=["Söndag","Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag"];
const today=new Date(); today.setHours(0,0,0,0);
let cursor=new Date(today.getFullYear(),today.getMonth(),1), selected=new Date(today), selectedType="PRIVAT", calendarMode="week";
function mondayOf(d){const x=new Date(d);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);x.setHours(0,0,0,0);return x}
let weekCursor=mondayOf(today);
let events={}; try{events=JSON.parse(localStorage.getItem("hq-calendar-v1")||"{}")}catch(e){events={}}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function week(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function save(){localStorage.setItem("hq-calendar-v1",JSON.stringify(events))}
function esc(v){const e=document.createElement("div");e.textContent=v;return e.innerHTML}
function render(){
 $("#weekday").textContent=days[today.getDay()];$("#dateNum").textContent=today.getDate();$("#monthTop").textContent=months[today.getMonth()].toUpperCase();
 const g=$("#grid");g.innerHTML="";
 let start,rows;
 if(calendarMode==="week"){start=new Date(weekCursor);rows=1;$("#monthTitle").textContent="Vecka "+week(start)+" · "+months[start.getMonth()]+" "+start.getFullYear();}
 else{const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),off=(first.getDay()+6)%7;start=new Date(first);start.setDate(first.getDate()-off);rows=6;$("#monthTitle").textContent=months[cursor.getMonth()]+" "+cursor.getFullYear();}
 for(let r=0;r<rows;r++){const mon=new Date(start);mon.setDate(start.getDate()+r*7);const row=document.createElement("div");row.className="weekrow";const wn=document.createElement("div");wn.className="weekno";wn.textContent="V"+week(mon);row.appendChild(wn);
  for(let c=0;c<7;c++){const d=new Date(mon);d.setDate(mon.getDate()+c);const k=key(d),b=document.createElement("button");b.type="button";b.className="day"+(calendarMode==="month"&&d.getMonth()!==cursor.getMonth()?" other":"")+(key(d)===key(today)?" today":"")+(key(d)===key(selected)?" selected":"");const types=[...new Set((events[k]||[]).map(e=>e.type))];b.innerHTML='<span class="num">'+d.getDate()+'</span>'+(types.length?'<span class="dots">'+types.map(t=>'<i class="dot '+t+'"></i>').join("")+'</span>':"");let holdTimer=null,longHeld=false;
b.addEventListener("pointerdown",()=>{longHeld=false;holdTimer=setTimeout(()=>{longHeld=true;openDay(d,true);if(navigator.vibrate)navigator.vibrate(18)},520)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>{if(holdTimer){clearTimeout(holdTimer);holdTimer=null}}));
b.addEventListener("click",()=>{if(longHeld){longHeld=false;return}selected=new Date(d);render()});
row.appendChild(b)}g.appendChild(row)}
 renderToday();
}
function renderToday(){const isToday=key(selected)===key(today),a=events[key(selected)]||[],box=$("#todayEvents");$("#selectedHeading").textContent=isToday?"Idag":selected.toLocaleDateString("sv-SE",{weekday:"long",day:"numeric",month:"long"});$("#todayCount").textContent=a.length+" "+(a.length===1?"AKTIVITET":"AKTIVITETER");box.innerHTML=a.length?"":'<div class="empty"><strong>Inget bokat</strong>Ingen aktivitet är bokad den här dagen.</div>';a.forEach(e=>{const x=document.createElement("div");x.className="event "+e.type;x.innerHTML='<div class="eventtime">'+(e.time||"—")+'</div><div><strong>'+esc(e.text)+'</strong><small>'+e.type+'</small></div>';box.appendChild(x)})}
function openDay(d,editMode=false){selected=new Date(d);$("#dayTitle").textContent=d.toLocaleDateString("sv-SE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});$("#dayWeek").textContent="Vecka "+week(d);renderDay();$(".form").style.display=editMode?"grid":"none";const sh=$("#sheet");sh.classList.add("open");requestAnimationFrame(()=>sh.classList.add("show"));render()}
function renderDay(){const a=events[key(selected)]||[],box=$("#dayEvents");box.innerHTML=a.length?"":'<div class="sub">Ingen aktivitet bokad den här dagen.</div>';a.forEach((e,i)=>{const x=document.createElement("div");x.className="row "+e.type;x.innerHTML='<div><strong>'+esc(e.text)+'</strong><div class="sub">'+(e.time?e.time+" · ":"")+e.type+'</div></div><button class="del" type="button">×</button>';x.querySelector(".del").onclick=()=>{a.splice(i,1);if(!a.length)delete events[key(selected)];save();renderDay();render()};box.appendChild(x)})}
function closeSheet(){const sh=$("#sheet");sh.classList.remove("show");setTimeout(()=>sh.classList.remove("open"),350)}
$("#prev").onclick=()=>{if(calendarMode==="week")weekCursor.setDate(weekCursor.getDate()-7);else cursor.setMonth(cursor.getMonth()-1);render()};
$("#next").onclick=()=>{if(calendarMode==="week")weekCursor.setDate(weekCursor.getDate()+7);else cursor.setMonth(cursor.getMonth()+1);render()};
$("#weekView").onclick=()=>{calendarMode="week";weekCursor=mondayOf(selected);$("#weekView").classList.add("active");$("#monthView").classList.remove("active");render()};
$("#monthView").onclick=()=>{calendarMode="month";cursor=new Date(selected.getFullYear(),selected.getMonth(),1);$("#monthView").classList.add("active");$("#weekView").classList.remove("active");render()};
$$(".type").forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;$$(".type").forEach(x=>x.classList.toggle("sel",x===b))});
$("#add").onclick=()=>{const text=$("#eventText").value.trim();if(!text){$("#eventText").focus();return}const k=key(selected);events[k]=events[k]||[];events[k].push({text,time:$("#eventTime").value,type:selectedType});events[k].sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));save();$("#eventText").value="";$("#eventTime").value="";renderDay();render()};
$("#cancel").onclick=closeSheet;$("#sheet").addEventListener("click",e=>{if(e.target===$("#sheet"))closeSheet()});
function page(id){["home","work","music","private"].forEach(x=>{const e=$("#"+x);if(x==="home")e.style.display=x===id?"block":"none";else e.classList.toggle("open",x===id)});$("#dock").style.display=id==="home"?"grid":"none";window.scrollTo(0,0)}
$$("[data-page]").forEach(b=>b.onclick=()=>page(b.dataset.page));$$("[data-back]").forEach(b=>b.onclick=()=>page("home"));
render();
})();
</script>
</body></html>
