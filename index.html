<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HQ · CTRL ROOM</title><link rel="stylesheet" href="shared/hq.css"><style>.musicfields{display:none;margin-top:14px}.musicfields.show{display:grid;gap:10px}.musicfields select{width:100%;margin-top:6px;border:1px solid #ffffff18;border-radius:15px;background:#0a0d12;color:#fff;padding:13px}.musicfields label{font:800 9px ui-monospace,monospace;color:#8993a1}.smart{display:none;margin-top:14px;padding:14px;border-radius:17px;border:1px solid #ffffff1b;background:#ffffff08}.smart.show{display:block}.smart small{display:block;color:#8993a1;font:800 9px ui-monospace,monospace;letter-spacing:.12em}.smart b{display:block;margin-top:7px;font-size:14px}.smart button{width:100%;margin-top:11px;border:1px solid #ffffff20;border-radius:13px;padding:11px;background:#ffffff12;color:#fff;font-weight:800}</style></head><body><main class="shell"><div class="ey">HQ</div><h1>CTRL ROOM</h1><p id="date" class="muted"></p><section class="glass hero"><div class="label">NU</div><h2>Allt samlat. En sak i taget.</h2><p>Fånga det som snurrar i huvudet först. Sortera senare.</p><button id="capture">＋ CAPTURE</button></section><div class="head"><b>NEXT</b><span id="count">0</span></div><div id="next" class="glass card muted">Ingen nästa åtgärd vald ännu.</div><div class="head"><b>INBOX</b><button id="clear" class="link">RENSA</button></div><div id="inbox"></div><nav class="grid"><a class="glass" href="calendar/index.html"><b>CALENDAR</b><span>Din kalender</span></a><a class="glass" href="rack/index.html"><b>THE RACK</b><span>Musikprojekt</span></a><a class="glass" href="workspace/index.html"><b>WORKSPACE</b><span>Jobb</span></a><a class="glass" href="home/index.html"><b>HOME</b><span>Privat</span></a></nav></main><div id="wrap"><div id="scrim"></div><div class="sheet glass"><div class="head"><b>CAPTURE</b><button id="close" class="link">STÄNG</button></div><h2>Vad behöver HQ veta?</h2><textarea id="input" rows="4" placeholder="Skriv precis som du tänker…"></textarea><div class="chips"><button data-area="MUSIK">MUSIK</button><button data-area="JOBB">JOBB</button><button data-area="PRIVAT">PRIVAT</button><button data-area="OSORTERAT" class="active">OSORTERAT</button></div><div id="smart" class="smart"><small>HQ FÖRSLAG</small><b id="smartText"></b><button id="smartUse" type="button">LÄGG TILL I THE RACK</button></div><div id="musicFields" class="musicfields"><label>PROJEKT<select disabled><option>Blodstänk &amp; Skålar</option></select></label><label>LÅT<select id="track"></select></label></div><button id="save">SPARA I HQ</button></div></div><script>
const $=s=>document.querySelector(s),K="hq_core_v1_inbox",RK="hq-rack-v3-meta",tracks=["Nah Nah Nah","BS&S","Högre","95","Rikedom","Rap","Click Clack","Jag vill upp","Ryssen kommer","Ålderskris","Ha ha ha","På din dörr","Maskotar","Ondskan","Skiner","Hicka/Dubai","Svart bälte","Panenka","Champion","Värdefullt"];let area="OSORTERAT";$("#track").innerHTML='<option value="">Välj låt…</option>'+tracks.map((x,i)=>`<option value="${i}">${String(i+1).padStart(2,"0")} · ${x}</option>`).join("");let detected=null;
function detectTrack(){
 const text=$("#input").value.trim().toLocaleLowerCase("sv-SE");
 detected=null;
 if(text){
   tracks.forEach((name,i)=>{if(text.includes(name.toLocaleLowerCase("sv-SE")))detected=i});
 }
 const box=$("#smart");
 if(detected!==null){
   $("#smartText").textContent=tracks[detected]+" · Blodstänk & Skålar";
   box.classList.add("show");
 }else box.classList.remove("show");
}
$("#input").addEventListener("input",detectTrack);
$("#smartUse").addEventListener("click",()=>{
 if(detected===null)return;
 let text=$("#input").value.trim(); if(!text)return;
 let name=tracks[detected];
 let task=text.replace(new RegExp("\\s+(på|för)\\s+"+name.replace(/[.*+?^${}()|[\\]\\]/g,"\\$&")+"\\s*$","i"),"").trim();
 if(!task)task=text;
 rackTask(detected,task);
 $("#input").value="";detected=null;$("#smart").classList.remove("show");close();render();
 try{navigator.vibrate&&navigator.vibrate([12,35,12])}catch(e){}
});
const load=()=>{try{return JSON.parse(localStorage.getItem(K)||"[]")}catch{return[]}},store=a=>localStorage.setItem(K,JSON.stringify(a));function render(){let a=load();$("#count").textContent=a.length;$("#next").textContent=a.length?a[0].text:"Ingen nästa åtgärd vald ännu.";$("#inbox").innerHTML=a.length?a.map((x,i)=>`<div class="glass item"><div><em>${x.area}</em><p>${x.text.replace(/</g,"&lt;")}</p></div><button class="done" data-i="${i}">✓</button></div>`).join(""):'<div class="glass card muted">Inbox är tom. Bra läge.</div>';document.querySelectorAll(".done").forEach(b=>b.onclick=()=>{a.splice(+b.dataset.i,1);store(a);render()})}$("#capture").onclick=()=>$("#wrap").classList.add("open");const close=()=>$("#wrap").classList.remove("open");$("#close").onclick=$("#scrim").onclick=close;document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{area=b.dataset.area;document.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("active",x===b));$("#musicFields").classList.toggle("show",area==="MUSIK")});function rackTask(i,text){let m={};try{m=JSON.parse(localStorage.getItem(RK)||"{}")}catch{};m[i]=m[i]||{};m[i].tasks=Array.isArray(m[i].tasks)?m[i].tasks:[];m[i].tasks.push({text,done:false});localStorage.setItem(RK,JSON.stringify(m))}$("#save").onclick=()=>{let text=$("#input").value.trim();if(!text)return;if(area==="MUSIK"){let v=$("#track").value;if(v===""){alert("Välj vilken låt uppgiften gäller.");return}rackTask(+v,text)}else{let a=load();a.unshift({text,area,created:new Date().toISOString()});store(a)}$("#input").value="";$("#track").value="";area="OSORTERAT";document.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("active",x.dataset.area==="OSORTERAT"));$("#musicFields").classList.remove("show");close();render()};$("#clear").onclick=()=>{if(confirm("Rensa hela Inbox?")){store([]);render()}};$("#date").textContent=new Date().toLocaleDateString("sv-SE",{weekday:"long",day:"numeric",month:"long"}).toUpperCase();render();</script></body></html>
